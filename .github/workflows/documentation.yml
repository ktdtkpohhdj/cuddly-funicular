name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - site

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install mkdocs mkdocs-material mkdocstrings[python] mkdocs-gen-files pyyaml
          
      - name: Checkout plugins from config
        env:
          GH_PAT: ${{ secrets.PL_TOKEN }}
        run: python docs/checkout_plugins.py

          
      - name: Set PYTHONPATH
        run: |
           PY_PATH=""

           for dir in plugins/*; do
             PY_PATH="$PY_PATH:$(pwd)/$dir/src"
           done

           echo "PYTHONPATH=$PY_PATH" >> $GITHUB_ENV

      - name: Generate plugin docs
        run: python docs/generate_plugin_docs.py    

      - name: Build MkDocs site
        run: mkdocs build --clean

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
