name: Build MkDocs

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          pip install mkdocs mkdocstrings[python] mkdocs-material
          
      - name: Fetch cuddly_funicular_privat docs
        run: |
              git clone https://x-access-token:${{ secrets.PLUGIN_DOCS_TOKEN }}@github.com/ktdtkpohhdj/cuddly_funicular_privat.git /tmp/cuddly_funicular_privat
              mkdir -p docs/plugins/cuddly-funicular
              cp -R /tmp/cuddly_funicular_privat/docs/* docs/plugins/cuddly-funicular/

      - run: mkdocs build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4

