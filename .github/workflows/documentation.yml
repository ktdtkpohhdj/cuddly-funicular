name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - site

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install mkdocs mkdocs-material mkdocstrings[python]
          
      - name: Checkout private docs
        uses: actions/checkout@v4
        with:
          repository: ktdtkpohhdj/cuddly_funicular_privat
          token: ${{ secrets.PL_TOKEN }}
          path: private_plugin_temp

          
      - name: Install Markdown generator
        run: pip install pymarkdoc

      - name: Generate docs from private plugin
        run: |
           mkdir -p docs/private
           pymarkdoc -o docs/private/cuddly_funicular_privat.md private_plugin_temp/src

          
      - name: Debug private docs
        run: |
          echo "Listing docs/private"
          ls -R docs/private1
          
      - name: Generate nav
        run: python generate_nav.py

      - name: Build MkDocs site
        run: mkdocs build --clean

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
