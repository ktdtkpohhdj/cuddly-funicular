site_name: Cuddly Funicular
theme:
  name: material

plugins:
  - search
  - awesome-pages
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: ["cuddy-funicular/src"]

nav:
  - Start: index.md
  - Example: example.md
  - Privat:
      - privat/
  - Practice: practice.md

