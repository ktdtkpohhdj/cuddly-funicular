site_name: Cuddly Funicular
theme:
  name: material

plugins:
  - search
  - awesome-pages:
      collapse_single_pages: false
      recursive: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: ["cuddy-funicular/src"]

nav:
  - Start: index.md
  - Example: example.md
  - Private:
      - private/
  - Practice: practice.md
  - Privat:
      - privat/
  

